# A source that offers a WebVTT rendition reaches a DLNA TV as an SRT track beside the media, instead of a whisper burn-in.
castor:
  cast: {subtitles: fr}
stream:
  packaging: hls-ts
  video: {codec: h264, ladder: [240, 360]}
  audio: {codec: aac, channels: 2}
origin:
  source-captions: {language: fr}
receiver:
  device:
    dlna:
      sink: "http-get:*:application/x-subrip:*,http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_AAC_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
expect:
  captioned: srt

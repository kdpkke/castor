# fMP4 segments that go quiet for good with a viewer watching: the device is held while castor waits for the origin, then the cast ends rather than pointing the device somewhere else mid-title.
stream:
  packaging: hls-fmp4
  video: {codec: h264, height: 360}
  audio: {codec: aac, channels: 2}
  seconds: 60
origin:
  stalls-at: 40
receiver:
  device:
    dlna:
      sink: "http-get:*:video/mp2t:DLNA.ORG_PN=AVC_TS_HD_AAC_ISO,http-get:*:audio/mp4:DLNA.ORG_PN=AAC_ISO"
      decodes:
        video: {h264: 8}
        audio: {aac: 2}
outcome: aborted
